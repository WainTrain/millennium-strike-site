<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Strike Community Pack</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            isolation: isolate;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -12px;
            z-index: -1;
            background:
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                url("images/MS_COMMUNITY_PACK_COVER.png") center / cover no-repeat;
            filter: blur(8px);
        }

        img {
            width: min(300px, calc(100vw - 32px));
            aspect-ratio: 1;
            object-fit: cover;
        }

        .download-link {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            color: inherit;
            text-decoration: none;
            background: #efefef;
            border: 1px solid #767676;
            border-radius: 2px;
        }

        .download-link:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main>
        <img
            src="images/MS_COMMUNITY_PACK_COVER.png"
            alt="MS COMMUNITY PACK Cover"
        >

        <a
            class="download-link"
            href="downloads/MS COMMUNITY PACK 1.zip"
            download="MS COMMUNITY PACK 1.zip"
        >
            Download MS COMMUNITY PACK 1
        </a>
    </main>
</body>
</html>
