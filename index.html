<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Strike Community Pack</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            isolation: isolate;
        }

        .site-header {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 1;
            padding: 16px 24px;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .site-logo {
            display: block;
            width: clamp(240px, 20vw, 220px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -12px;
            z-index: -1;
            background:
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                url("images/MS_COMMUNITY_PACK_COVER.png") center / cover no-repeat;
            filter: blur(8px);
        }

        .cover-image {
            width: min(300px, calc(100vw - 32px));
            aspect-ratio: 1;
            object-fit: cover;
        }

        .download-link {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            color: inherit;
            text-decoration: none;
            background: #efefef;
            border: 1px solid #767676;
            border-radius: 2px;
        }

        .download-link:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <img
            class="site-logo"
            src="images/ms_white_1.png"
            alt="Millennium Strike"
        >
    </header>

    <main>
        <img
            class="cover-image"
            src="images/MS_COMMUNITY_PACK_COVER.png"
            alt="MS COMMUNITY PACK Cover"
        >

        <a
            class="download-link"
            href="downloads/MS COMMUNITY PACK 1.zip"
            download="MS COMMUNITY PACK 1.zip"
        >
            Download MS COMMUNITY PACK 1
        </a>
    </main>
</body>
</html>
