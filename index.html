<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Strike Community Pack</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

    <style>
        @font-face {
            font-family: Neuropol;
            src: url("fonts/neuropol.ttf") format("truetype");
            font-display: swap;
        }

        body {
            margin: 0;
            min-height: 100vh;
            isolation: isolate;
        }

        .site-header {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 1;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .site-logo {
            display: block;
            width: clamp(240px, 20vw, 220px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-top: 10px;
        }

        .social-links a {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            color: #fff;
            pointer-events: auto;
            transition: opacity 150ms ease, transform 150ms ease;
        }

        .social-links a[aria-label="Bandcamp"] img {
           transform: scale(1.2);
        }

        .social-links a[aria-label="Bluesky"] img {
           transform: scale(0.6);
        }

        .social-links a:hover {
            opacity: 0.75;
            transform: translateY(-2px);
        }

        .social-links a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }

        .social-links img,
        .social-links svg {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .social-links img {
            filter: brightness(0) invert(1);
        }

        .social-links svg {
            fill: currentColor;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -12px;
            z-index: -1;
            background:
                linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                url("images/MS_COMMUNITY_PACK_COVER.png") center / cover no-repeat;
            filter: blur(8px);
        }

        .cover-image {
            width: min(300px, calc(100vw - 32px));
            aspect-ratio: 1;
            object-fit: cover;
        }

        .download-link {
            display: inline-block;
            padding: 10px 20px;
            font-family: Neuropol, "Century Gothic", sans-serif;
            font-size: 16px;
            cursor: pointer;
            color: inherit;
            text-decoration: none;
            background: #efefef;
            border: 1px solid #767676;
            border-radius: 2px;
        }

        .download-link:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <img
            class="site-logo"
            src="images/ms_white_1.png"
            alt="Millennium Strike"
        >
        <nav class="social-links" aria-label="Social media">
            <a href="https://millenniumstrike.bandcamp.com" aria-label="Bandcamp">
                <img src="images/vectors/bandcamp-svgrepo-com.svg" alt="">
            </a>
            <a href="https://www.youtube.com/c/MillenniumStrike" aria-label="YouTube">
                <img src="images/vectors/youtube-play-svgrepo-com.svg" alt="">
            </a>
            <a href="https://www.instagram.com/millenniumstrike/" aria-label="Instagram">
                <img src="images/vectors/instagram-svgrepo-com.svg" alt="">
            </a>
            <a href="https://bsky.app/profile/millenniumstrike.bsky.social" aria-label="Bluesky">
                <img src="images/vectors/bluesky_media_kit_logo_transparent_4.svg" alt="">
            </a>
        </nav>
    </header>

    <main>
        <img
            class="cover-image"
            src="images/MS_COMMUNITY_PACK_COVER.png"
            alt="MS COMMUNITY PACK Cover"
        >

        <a
            class="download-link"
            href="downloads/MS COMMUNITY PACK 1.zip"
            download="MS COMMUNITY PACK 1.zip"
        >
            Download MS COMMUNITY PACK 1
        </a>
    </main>
</body>
</html>
